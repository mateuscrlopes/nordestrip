name: Build

on:
  pull_request:
  push:
    branches:
      - codex/implementar-estrutura-inicial-do-nordest-trip
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_build_check
      NEXT_PUBLIC_MAPTILER_KEY: browser_key_build_check
      OPENROUTESERVICE_API_KEY: server_key_build_check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run build
